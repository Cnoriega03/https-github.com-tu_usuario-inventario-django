{% extends "base.html" %}

{% block title %}Iniciar sesion{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="card shadow-sm login-card">
        <div class="card-body p-4">
            <h1 class="h4 mb-1">Sistema de Inventario</h1>
            <p class="text-muted mb-4">Ingresa con tu usuario y contrasena.</p>

            {% if form.errors %}
                <div class="alert alert-danger">Usuario o contrasena incorrectos.</div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
                    <input class="form-control" type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="{{ form.password.id_for_label }}">Contrasena</label>
                    <input class="form-control" type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Iniciar sesion</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
